<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="RoboCassano – RoboCup Junior Rescue Line">
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b3a4b"/>
    </linearGradient>
    <pattern id="piastrelle" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <linearGradient id="argento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa5b1"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#9aa5b1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#sfondo)"/>
  <rect width="1200" height="300" fill="url(#piastrelle)"/>

  <!-- la linea nera da seguire, con i verdi agli incroci -->
  <path d="M-10 268 C 150 268, 200 200, 330 200 S 520 268, 640 250 S 820 130, 900 140"
        fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <path d="M-10 268 C 150 268, 200 200, 330 200 S 520 268, 640 250 S 820 130, 900 140"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="22" stroke-linecap="round"/>
  <rect x="250" y="226" width="18" height="18" fill="#1faa59" rx="2"/>
  <rect x="690" y="214" width="18" height="18" fill="#1faa59" rx="2"/>

  <!-- ingresso argento e zona di evacuazione -->
  <rect x="900" y="118" width="12" height="44" fill="url(#argento)" rx="2"/>
  <rect x="912" y="60" width="260" height="190" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" rx="6"/>
  <polygon points="1172,60 1172,120 1112,60" fill="#d64545"/>
  <polygon points="1172,250 1172,190 1112,250" fill="#1faa59"/>
  <circle cx="1010" cy="120" r="10" fill="url(#argento)"/>
  <circle cx="1060" cy="200" r="10" fill="url(#argento)"/>
  <circle cx="980" cy="190" r="10" fill="#111111" stroke="#555" stroke-width="2"/>

  <!-- il robot visto dall'alto, sulla linea -->
  <g transform="translate(470 226) rotate(14)">
    <rect x="-26" y="-20" width="52" height="40" rx="8" fill="#1f8a70" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="-34" y="-24" width="10" height="16" rx="3" fill="#0b3d32"/>
    <rect x="-34" y="8" width="10" height="16" rx="3" fill="#0b3d32"/>
    <rect x="24" y="-24" width="10" height="16" rx="3" fill="#0b3d32"/>
    <rect x="24" y="8" width="10" height="16" rx="3" fill="#0b3d32"/>
    <circle cx="16" cy="0" r="5" fill="#fde047"/>
  </g>

  <!-- testi -->
  <text x="60" y="92" font-family="Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">RoboCassano</text>
  <text x="62" y="130" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a7f3d0">RoboCup Junior · Rescue Line</text>
  <text x="62" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">IISS "Erodoto di Thurii" · Cassano allo Ionio</text>
</svg>
